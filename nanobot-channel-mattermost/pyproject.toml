[project]
name = "nanobot-channel-mattermost"
version = "0.1.0"
description = "Mattermost channel plugin for nanobot"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "nanobot-ai>=0.2.1",
    "httpx>=0.28.0,<1.0.0",
    "websockets>=16.0,<17.0",
]

[project.entry-points."nanobot.channels"]
mattermost = "nanobot_channel_mattermost:MattermostChannel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanobot_channel_mattermost"]
